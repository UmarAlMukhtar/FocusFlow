name: Private Windows audio startup diagnostic
on:
  push:
    branches: [codex-audio-native-qualification]
permissions:
  contents: read
concurrency:
  group: private-windows-audio-discovery
  cancel-in-progress: false
jobs:
  native-discovery:
    if: github.repository == 'UmarAlMukhtar/FocusFlow' && github.ref == 'refs/heads/codex-audio-native-qualification'
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Exact upstream tag->commit receipts: root-action-pin-verification.json in Task 3 evidence.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        id: checkout
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: UmarAlMukhtar/FocusFlow
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.superpowers/sdd/2026-11-04-windows-audio-worker/Cargo.toml
            /.superpowers/sdd/2026-11-04-windows-audio-worker/Cargo.lock
            /.superpowers/sdd/2026-11-04-windows-audio-worker/src/
            /.superpowers/sdd/2026-11-04-windows-audio-worker/tests/
            /.superpowers/sdd/2026-11-04-windows-audio-worker/FIXTURE-SOURCE-MAP.json
            /.superpowers/sdd/2026-11-04-windows-audio-worker/NATIVE-PROOF-PLAN.json
            /FocusFlow/crates/focusflow-core/Cargo.toml
            /FocusFlow/crates/focusflow-core/Cargo.lock
            /FocusFlow/crates/focusflow-core/src/
            /tools/audio-proof/
            /.github/workflows/windows-audio-native-qualification.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: '3.12.10'
      - name: Build observations only; no native audio entry point
        id: build
        shell: pwsh
        run: |
          python tools/audio-proof/stage.py build
          if ($LASTEXITCODE -ne 0) { throw 'Build observations incomplete' }
      - name: Prepare explicit build artifact allowlist
        if: always() && steps.python.outcome == 'success'
        shell: pwsh
        run: |
          python tools/audio-proof/stage.py package-build
          if ($LASTEXITCODE -ne 0) { throw 'Build evidence packaging failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload-build
        if: always() && steps.python.outcome == 'success'
        with:
          name: private-audio-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audio-native-stage/build-upload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Same job bounded no-network startup diagnostic
        if: steps.build.outcome == 'success' && steps.upload-build.outcome == 'success'
        id: startup
        shell: pwsh
        run: |
          python tools/audio-proof/stage.py startup
          if ($LASTEXITCODE -ne 0) { throw 'Startup diagnostic incomplete; review exact projected receipts' }
      - name: Prepare explicit startup diagnostic artifact allowlist
        if: always() && steps.startup.outcome != 'skipped' && steps.startup.outcome != ''
        shell: pwsh
        run: |
          python tools/audio-proof/stage.py package-startup
          if ($LASTEXITCODE -ne 0) { throw 'Startup evidence packaging incomplete' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.startup.outcome != 'skipped' && steps.startup.outcome != ''
        with:
          name: private-audio-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audio-native-stage/startup-upload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
