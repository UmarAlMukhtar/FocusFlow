[package]
default-run = "FocusFlow"
name = "FocusFlow"
version = "0.2.0"
description = "Screen recording that edits itself"
authors = ["Umar Al Mukhtar"]
edition = "2021"
license = "MIT"
repository = "https://github.com/UmarAlMukhtar/FocusFlow"
homepage = "https://focusflow.demosnap.tech"
readme = "../../README.md"
keywords = ["screen-recording", "tauri", "rust", "ffmpeg", "tutorials"]
categories = ["multimedia", "gui"]

# See more keys and their definitions at:
# https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
# This avoids naming conflicts on Windows.
name = "focusflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
focusflow-core = { path = "../crates/focusflow-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Audio recording
# cpal uses the Windows WASAPI backend for low-latency, reliable mic access.
# hound writes PCM samples to WAV; pure-Rust, no unsafe code in our layer.
cpal  = "0.15"
hound = "3.5"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
x11rb = { version = "0.13.2", features = ["xinput"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.0"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Performance",
  "Win32_System_WinRT",
  "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Expose native ContentSize for fixed-geometry WGC admission; version remains 2.0.0.
[patch.crates-io]
windows-capture = { path = "../vendor/windows-capture" }

[[test]]
name = "windows_owned_qualification"
path = "src/lib.rs"
harness = false
test = false

[[test]]
name = "windows_encoder_fixture"
path = "tests/windows_encoder_fixture.rs"
harness = false
test = false

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops"] }
