[package]
name = "focusflow-windows-audio-worker"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace]

[dependencies]
hound = "=3.5.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
focusflow-core = { path = "../focusflow-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading",
  "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Performance",
  "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant", "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
] }
